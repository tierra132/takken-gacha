<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宅建がちゃ</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#20242a;--muted:#737982;--line:#e2e5e9;--red:#c93434;--blue:#3975c8;--gold:#d59b18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.app{max-width:720px;margin:auto;padding:18px 14px 36px}.head{text-align:center;margin:8px 0 18px}.head h1{font-size:30px;margin:0 0 4px}.head p{margin:0;color:var(--muted);font-size:13px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 8px #00000008}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:24px;font-weight:800;margin-top:3px}
.study{margin-top:10px}.study button,.adminbtn,.smallbtn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;background:#242a31;color:#fff}.study button:disabled{opacity:.45}
.gachas{display:grid;gap:14px;margin-top:14px}.gacha{padding:17px}.gacha.red{border-top:5px solid var(--red)}.gacha.blue{border-top:5px solid var(--blue)}
.gtitle{display:flex;justify-content:space-between;align-items:center}.gtitle h2{margin:0;font-size:22px}.gtitle .more{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:21px;line-height:1;font-weight:800;color:#555}
.catch{font-size:12px;color:var(--muted);margin:5px 0 13px}.actions{display:grid;grid-template-columns:1fr 1.25fr;gap:9px}.actions button{border:0;border-radius:12px;padding:13px 8px;color:white;font-weight:800;font-size:15px}.red .actions button{background:var(--red)}.blue .actions button{background:var(--blue)}.actions button:disabled{opacity:.3}
.links{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.links button{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700}
.detail{display:none;margin-top:14px}.detail.open{display:block}.detail h3{margin:0 0 10px}.history{max-height:280px;overflow:auto}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.row:last-child{border-bottom:0}.empty{color:var(--muted);padding:10px 0}
.probtable{width:100%;border-collapse:collapse;font-size:13px}.probtable th,.probtable td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:right}.probtable th:first-child,.probtable td:first-child{text-align:left}
.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.show{display:flex}.modal{width:min(460px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:22px;text-align:center}.modal h2{margin:0 0 10px}.modal p{color:var(--muted);line-height:1.6}.modal input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.modalBtns button{border:0;border-radius:11px;padding:12px;font-weight:800}.ok{background:#242a31;color:white}.cancel{background:#edf0f2}.singleBtn{width:100%;margin-top:12px;border:0;border-radius:11px;padding:12px;font-weight:800;background:#242a31;color:white}
.result{min-height:180px;display:flex;flex-direction:column;justify-content:center}.rarity{font-size:46px;font-weight:900;letter-spacing:2px}.amount{font-size:30px;font-weight:900;margin-top:8px}.n{color:#555}.r{color:#4779bd}.sr{color:#7953a6}.ssr{color:#c07a11}.ur{color:#b32626}
.spark{animation:pop .55s ease}.flash{animation:flash 1s ease}@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.45)}}
.batchSummary{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}
.batchItem{border:1px solid var(--line);border-radius:10px;padding:8px 3px;background:#fafbfc;text-align:center}
.batchItem .num{font-size:11px;color:var(--muted)}.batchItem .rar{font-size:17px;font-weight:900;margin-top:2px}.batchItem .amt{font-size:12px;font-weight:800;margin-top:2px}
.batchItem.eleven{grid-column:3;border:2px solid var(--gold);background:#fffaf0}
.batchItem.eleven .num{font-weight:800;color:#9a7110}
.summaryTotal{margin-top:12px;padding:12px;border-radius:11px;background:#f3f5f7;display:flex;justify-content:space-between;font-weight:800}
@media(max-width:430px){.batchSummary{gap:5px}.batchItem{padding:7px 2px}.batchItem .rar{font-size:15px}.batchItem .amt{font-size:10px}}
.admin{display:none}.admin.open{display:block}.admin input,.admin select{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--line);border-radius:9px}.admin label{font-size:12px;color:var(--muted)}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:#a92b2b!important}.back{margin-top:10px}.probedit{display:grid;grid-template-columns:58px 1fr 85px;gap:7px;align-items:center;margin:5px 0}.probedit input{margin:0!important}.sectionTitle{font-weight:800;margin:18px 0 8px}
@media(max-width:430px){.status{grid-template-columns:1fr 1fr}.stat .value{font-size:21px}}
</style>
</head>
<body>
<div class="app">
  <header class="head"><h1>宅建がちゃ</h1><p>30分勉強して、がちゃ回数券を1枚。</p><p id="cloudStatus" style="margin-top:6px;font-size:11px">☁️ Firebase接続準備中…</p></header>

  <section class="status">
    <div class="stat"><div class="label">🎫 ガチャ可能回数</div><div class="value" id="tickets">0枚</div></div>
    <div class="stat"><div class="label">⏳ 試験まで</div><div class="value" id="countdown">--</div></div>
    <div class="stat"><div class="label">📚 今日の勉強時間</div><div class="value" id="todayStudy">0分</div></div>
    <div class="stat"><div class="label">📖 累計勉強時間</div><div class="value" id="totalStudy">0時間0分</div></div>
  </section>

  <section class="card study"><button id="studyBtn">30分勉強したことを記録する</button></section>

  <section class="gachas">
    <div class="card gacha red">
      <div class="gtitle"><h2>🔴 赤がちゃ</h2><button class="more" id="redDetailBtn" aria-label="赤がちゃ詳細">⋯</button></div>
      <div class="catch">さあ行こーか</div>
      <div class="actions"><button id="red1">1連</button><button id="red10">10連＋1</button></div>
    </div>
    <div class="card gacha blue">
      <div class="gtitle"><h2>🔵 青がちゃ</h2><button class="more" id="blueDetailBtn" aria-label="青がちゃ詳細">⋯</button></div>
      <div class="catch">まだあわてるような時間じゃない</div>
      <div class="actions"><button id="blue1">1連</button><button id="blue10">10連＋1</button></div>
    </div>
  </section>

  <section class="links">
    <button id="historyBtn">📜 ガチャ履歴</button><button id="statsBtn">📊 レアリティ集計</button>
    <button id="moneyBtn">💰 獲得金額</button><button id="adminBtn">⚙ 管理</button>
  </section>

  <section id="detail" class="card detail"></section>
  <section id="admin" class="card admin"></section>
</div>

<div id="modal" class="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, runTransaction
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCjZ19wUhYKssy4cLCVtCdxyn6YvS0Vi2I",
  authDomain: "takken-gacha.firebaseapp.com",
  projectId: "takken-gacha",
  storageBucket: "takken-gacha.firebasestorage.app",
  messagingSenderId: "899764202403",
  appId: "1:899764202403:web:9e0f59e9129ac63d134816"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const STATE_REF = doc(db, "app", "state");

const ADMIN_PASSWORD = "takken261018";
const KEY="takken_gacha_v2";
const OLD_KEY="takken_gacha_v1";

const DEFAULT_TABLES={
  red:[["N",0,72],["R",500,20],["SR",1000,5],["SSR",4000,2],["UR",10000,1]],
  blue:[["N",100,30],["R",300,35],["SR",500,20],["SSR",1000,10],["UR",2000,5]],
  redBonus:[["N",0,70],["R",500,20],["SR",1000,5],["SSR",4000,3],["UR",10000,2]],
  blueBonus:[["N",100,5],["R",300,15],["SR",500,20],["SSR",1000,20],["UR",2000,40]]
};

const defaults={
  tickets:0,todayStudy:0,totalStudy:0,lastStudyDate:"",
  history:[],winnings:0,examDate:"2026-10-18",
  tables:structuredClone(DEFAULT_TABLES)
};

function clone(v){return structuredClone(v)}

function decodeTables(tables){
  const src=tables||{};
  const out={};
  for(const key of Object.keys(DEFAULT_TABLES)){
    const v=src[key];
    if(Array.isArray(v)){
      // Legacy/local format: [["N",0,72], ...]
      out[key]=v.map(x=>Array.isArray(x)?[x[0],Number(x[1])||0,Number(x[2])||0]:x);
    }else if(v && typeof v==="object"){
      // Firestore-safe format: [{rarity:"N",amount:0,probability:72}, ...]
      const vals=Object.keys(v).sort((a,b)=>Number(a)-Number(b)).map(k=>v[k]);
      out[key]=vals.map(x=>[x.rarity,Number(x.amount)||0,Number(x.probability)||0]);
    }
  }
  return out;
}

function encodeTables(tables){
  const out={};
  for(const key of Object.keys(DEFAULT_TABLES)){
    out[key]=(tables[key]||[]).map(x=>({
      rarity:String(x[0]),
      amount:Number(x[1])||0,
      probability:Number(x[2])||0
    }));
  }
  return out;
}

function toFirestoreState(s){
  const x=clone(s);
  x.tables=encodeTables(s.tables);
  return x;
}

function normalizeState(s){
  const raw=clone(s||{});
  const decodedTables=decodeTables(raw.tables);
  delete raw.tables;
  const x={...clone(defaults),...raw};
  x.history=Array.isArray(x.history)?x.history:[];
  x.tables={...clone(DEFAULT_TABLES),...decodedTables};
  for(const k of Object.keys(DEFAULT_TABLES)){
    if(!Array.isArray(x.tables[k])||x.tables[k].length!==5)x.tables[k]=clone(DEFAULT_TABLES[k]);
  }
  x.tickets=Math.max(0,Number(x.tickets)||0);
  x.todayStudy=Math.max(0,Number(x.todayStudy)||0);
  x.totalStudy=Math.max(0,Number(x.totalStudy)||0);
  x.winnings=Math.max(0,Number(x.winnings)||0);
  x.examDate=x.examDate||"2026-10-18";
  return x;
}

function readLocalSeed(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch{}
  if(!s){
    try{s=JSON.parse(localStorage.getItem(OLD_KEY)||"null")}catch{}
  }
  if(!s)return clone(defaults);
  s=normalizeState(s);
  s.history=s.history.map(x=>({...x,dateKey:x.dateKey||dateKeyFromStored(x.time)}));
  return s;
}

let state=clone(defaults);
let cloudReady=false;

function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function jpDateKey(d=new Date()){
  return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(d).replace(/\//g,"-");
}
function dateKeyFromStored(s){
  if(!s)return "";
  const m=String(s).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  return m?`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`:"";
}
function examDate(){
  return new Date(`${state.examDate||"2026-10-18"}T00:00:00+09:00`);
}
function yen(n){return Number(n||0).toLocaleString("ja-JP")+"円"}
function fmt(min){return `${Math.floor(min/60)}時間${min%60}分`}
function getTodayHistory(){const d=jpDateKey();return state.history.filter(x=>(x.dateKey||dateKeyFromStored(x.time))===d)}
function getPaidDrawCount(){return state.history.reduce((sum,x)=>sum+(x.paid?1:0),0)}
function getPaidDrawCountToday(){return getTodayHistory().reduce((sum,x)=>sum+(x.paid?1:0),0)}
function getDrawCount(){return state.history.length}
function getDrawCountToday(){return getTodayHistory().length}
function getPaidAmount(){return getPaidDrawCount()*500}
function getPaidAmountToday(){return getPaidDrawCountToday()*500}
function weighted(t){
  let r=Math.random()*100,s=0;
  for(const x of t){s+=Number(x[2])||0;if(r<s)return x}
  return t[t.length-1];
}

function setCloudStatus(text){
  const el=document.getElementById("cloudStatus");
  if(el)el.textContent=text;
}

function render(){
  document.getElementById("tickets").textContent=state.tickets+"枚";
  document.getElementById("todayStudy").textContent=state.todayStudy+"分";
  document.getElementById("totalStudy").textContent=fmt(state.totalStudy);
  const diff=examDate()-new Date();
  document.getElementById("countdown").textContent=diff<=0?"合格待ち":Math.ceil(diff/86400000)+"日";
  ["red1","blue1"].forEach(id=>document.getElementById(id).disabled=state.tickets<1);
  ["red10","blue10"].forEach(id=>document.getElementById(id).disabled=state.tickets<10);
}

function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

function openModal(html){document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show");document.getElementById("modalBody").innerHTML=""}

async function ensureCloudState(){
  setCloudStatus("☁️ Firebase接続中…");
  const seed=readLocalSeed();
  const result=await runTransaction(db,async tx=>{
    const snap=await tx.get(STATE_REF);
    if(snap.exists())return snap.data();
    tx.set(STATE_REF,toFirestoreState(seed));
    return seed;
  });
  state=normalizeState(result);
  cloudReady=true;
  cacheLocal();
  setCloudStatus("☁️ データ共有中");
  render();
}

async function refreshCloud(){
  const snap=await getDoc(STATE_REF);
  if(!snap.exists()){
    await ensureCloudState();
    return;
  }
  state=normalizeState(snap.data());
  cloudReady=true;
  cacheLocal();
  setCloudStatus("☁️ データ共有中");
  render();
}

async function updateCloud(mutator){
  if(!cloudReady)throw new Error("Firebaseに接続できていません");
  const result=await runTransaction(db,async tx=>{
    const snap=await tx.get(STATE_REF);
    const current=normalizeState(snap.exists()?snap.data():state);
    const updated=normalizeState(await mutator(current));
    tx.set(STATE_REF,toFirestoreState(updated));
    return updated;
  });
  state=normalizeState(result);
  cacheLocal();
  render();
  return state;
}

document.getElementById("studyBtn").onclick=()=>openModal(`<h2>30分勉強お疲れ様です。</h2><p>勉強時間を記録しますか？</p><div class="modalBtns"><button class="cancel" id="studyNo">いいえ</button><button class="ok" id="studyYes">はい</button></div>`);

document.addEventListener("click",async e=>{
  if(e.target.id==="studyNo")closeModal();
  if(e.target.id==="studyYes"){
    try{
      const before=state.todayStudy;
      await updateCloud(s=>{
        const d=jpDateKey();
        if(s.lastStudyDate!==d){s.todayStudy=0;s.lastStudyDate=d}
        if(s.todayStudy<600){
          s.todayStudy+=30;s.totalStudy+=30;s.tickets+=1;
        }
        return s;
      });
      if(before>=600 || state.todayStudy===0){
        openModal(`<h2>本日の上限です</h2><p>今日は最大10枚まで獲得できます。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
      }else{
        openModal(`<div class="result"><div class="rarity">🎫</div><div class="amount">がちゃ回数券 1枚獲得！</div></div><button class="singleBtn" id="modalCloseBtn">OK</button>`);
      }
    }catch(err){
      console.error(err);
      openModal(`<h2>保存できませんでした</h2><p>Firebaseへの接続でエラーが発生しました。</p><p style="font-size:12px;text-align:left;word-break:break-word;background:#111;padding:10px;border-radius:8px;">${escapeHtml((err && (err.code || err.message)) ? ((err.code||"") + " " + (err.message||"")) : String(err))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }
  }
  if(e.target.id==="modalCloseBtn")closeModal();
  if(e.target.id==="login"){
    if(document.getElementById("pw").value===ADMIN_PASSWORD){closeModal();showAdmin()}
    else openModal(`<h2>パスワードが違います</h2><button class="singleBtn" id="modalCloseBtn">OK</button>`);
  }
});

function confirmDraw(type,count){
  if(state.tickets<count)return;
  const name=type==="red"?"🔴 赤がちゃ":"🔵 青がちゃ";
  openModal(`<h2>${name}</h2><p>🎫 回数券を${count}枚使います。<br>${count===10?"10連＋1を引きます。":"1連を引きます。"}<br><br><b>引きますか？</b></p><div class="modalBtns"><button class="cancel" id="drawNo">やめる</button><button class="ok" id="drawYes">ガチャを引く！</button></div>`);
  document.getElementById("drawNo").onclick=closeModal;
  document.getElementById("drawYes").onclick=()=>doDraw(type,count);
}

async function doDraw(type,count){
  closeModal();
  try{
    const result=await runTransaction(db,async tx=>{
      const snap=await tx.get(STATE_REF);
      const s=normalizeState(snap.exists()?snap.data():state);
      if(s.tickets<count)throw new Error("NOT_ENOUGH_TICKETS");
      const dateKey=jpDateKey(), time=new Date().toLocaleString("ja-JP");
      const results=[];
      for(let i=0;i<count;i++){
        const x=weighted(s.tables[type]);
        results.push({rarity:x[0],amount:Number(x[1]),drawNo:i+1,paid:true});
      }
      if(count===10){
        const x=weighted(s.tables[type+"Bonus"]);
        results.push({rarity:x[0],amount:Number(x[1]),drawNo:11,paid:false});
      }
      s.tickets-=count;
      results.forEach(x=>{
        s.history.push({time,dateKey,type,drawNo:x.drawNo,rarity:x.rarity,amount:x.amount,paid:x.paid});
        s.winnings+=x.amount;
      });
      tx.set(STATE_REF,toFirestoreState(s));
      return {state:s,results};
    });
    state=normalizeState(result.state);
    cloudReady=true;
    cacheLocal();
    render();
    showResults(result.results,0);
  }catch(err){
    console.error(err);
    if(err.message==="NOT_ENOUGH_TICKETS"){
      await refreshCloud();
      openModal(`<h2>回数券が足りません</h2><p>別の端末で回数券が使われた可能性があります。最新の状態に更新しました。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }else{
      openModal(`<h2>ガチャを保存できませんでした</h2><p>Firebaseへの接続でエラーが発生しました。</p><p style="font-size:12px;text-align:left;word-break:break-word;background:#111;padding:10px;border-radius:8px;">${escapeHtml((err && (err.code || err.message)) ? ((err.code||"") + " " + (err.message||"")) : String(err))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }
  }
}

function showResults(rs,i){
  if(i>=rs.length){
    if(rs.length===11){
      const total=rs.reduce((a,x)=>a+x.amount,0);
      const items=rs.map((x,idx)=>`<div class="batchItem ${idx===10?"eleven":""}">
        <div class="num">${idx+1}回目</div>
        <div class="rar ${x.rarity.toLowerCase()}">${x.rarity}</div>
        <div class="amt">${yen(x.amount)}</div>
      </div>`).join("");
      openModal(`<h2>10連＋1 結果</h2><div class="batchSummary">${items}</div><div class="summaryTotal"><span>11回合計</span><span>${yen(total)}</span></div><button class="singleBtn" id="modalCloseBtn">閉じる</button>`);
      return;
    }
    closeModal();return;
  }
  const x=rs[i], cls=x.rarity.toLowerCase();
  openModal(`<div class="result ${x.rarity==="UR"?"flash":""}"><div style="font-size:13px;color:#777">${rs.length===11?x.drawNo+"回目":""}</div><div class="rarity ${cls} spark">${x.rarity}</div><div class="amount">${yen(x.amount)}</div></div>`);
  const b=document.createElement("button");
  b.className="singleBtn";
  b.textContent=i===rs.length-1?"結果一覧を見る":"次へ";
  b.onclick=()=>showResults(rs,i+1);
  document.getElementById("modalBody").appendChild(b);
}

document.getElementById("red1").onclick=()=>confirmDraw("red",1);
document.getElementById("blue1").onclick=()=>confirmDraw("blue",1);
document.getElementById("red10").onclick=()=>confirmDraw("red",10);
document.getElementById("blue10").onclick=()=>confirmDraw("blue",10);

function detail(html){
  const d=document.getElementById("detail");d.innerHTML=html;d.classList.add("open");
  document.getElementById("admin").classList.remove("open");
}
function tableHtml(type,title){
  return `<h3>${title}</h3><table class="probtable"><thead><tr><th>レアリティ</th><th>金額</th><th>排出確率</th></tr></thead><tbody>
  ${state.tables[type].map(x=>`<tr><td>${x[0]}</td><td>${yen(x[1])}</td><td>${x[2]}%</td></tr>`).join("")}</tbody></table>
  <div class="note">※表示しているのは通常の1連の排出確率です。10連＋1の11回目は別設定です。</div>`;
}
document.getElementById("redDetailBtn").onclick=()=>detail(tableHtml("red","🔴 赤がちゃ 詳細"));
document.getElementById("blueDetailBtn").onclick=()=>detail(tableHtml("blue","🔵 青がちゃ 詳細"));

document.getElementById("historyBtn").onclick=()=>{
  let h=state.history.slice().reverse().map(x=>`<div class="row"><span>${x.time}<br>${x.type==="red"?"🔴":"🔵"} ${x.drawNo}回目・${x.rarity}${x.paid===false?"（11回目）":""}</span><b>${yen(x.amount)}</b></div>`).join("");
  detail(`<h3>📜 ガチャ履歴</h3><div class="history">${h||'<div class="empty">まだ履歴はありません。</div>'}</div>`);
};
document.getElementById("statsBtn").onclick=()=>{
  let r={N:0,R:0,SR:0,SSR:0,UR:0};state.history.forEach(x=>r[x.rarity]++);
  detail(`<h3>📊 レアリティ集計</h3><div class="row"><span>合計で引いた回数</span><b>${getDrawCount()}回</b></div>
  ${Object.entries(r).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}回</b></div>`).join("")}`);
};
document.getElementById("moneyBtn").onclick=()=>{
  const th=getTodayHistory(),tw=th.reduce((a,x)=>a+x.amount,0);
  detail(`<h3>💰 獲得金額</h3>
    <div class="card" style="margin-top:10px;border-left:5px solid #555"><h3 style="margin:0 0 8px">📅 今日</h3>
      <div class="row"><span>獲得金額</span><b>${yen(tw)}</b></div><div class="row"><span>引いた回数</span><b>${getDrawCountToday()}回</b></div><div class="row"><span>回数券代</span><b>${yen(getPaidAmountToday())}</b></div>
    </div>
    <div class="card" style="margin-top:10px;border-left:5px solid #3975c8"><h3 style="margin:0 0 8px">📚 累計</h3>
      <div class="row"><span>獲得金額</span><b>${yen(state.winnings)}</b></div><div class="row"><span>引いた回数</span><b>${getDrawCount()}回</b></div><div class="row"><span>回数券代</span><b>${yen(getPaidAmount())}</b></div>
    </div>`);
};

document.getElementById("adminBtn").onclick=()=>openModal(`<h2>🔐 管理</h2><p>管理パスワードを入力してください。</p><input id="pw" type="password" autocomplete="off"><div class="modalBtns"><button class="cancel" id="adminCancel">キャンセル</button><button class="ok" id="login">入室</button></div>`);
document.addEventListener("click",e=>{if(e.target.id==="adminCancel")closeModal()});

function tableEditor(key,label){
  return `<div class="sectionTitle">${label}</div><div class="probedit" style="font-size:12px;color:#737982"><span>レア</span><span>金額</span><span>確率(%)</span></div>
  ${state.tables[key].map((x,i)=>`<div class="probedit"><span><b>${x[0]}</b></span><input type="number" min="0" id="${key}_amt_${i}" value="${x[1]}"><input type="number" min="0" max="100" step="0.1" id="${key}_p_${i}" value="${x[2]}"></div>`).join("")}
  <div class="note">確率合計は100%にしてください。</div>`;
}

function showAdmin(){
  const a=document.getElementById("admin");a.classList.add("open");document.getElementById("detail").classList.remove("open");
  a.innerHTML=`<h3>⚙ 管理画面</h3>
    <label>ガチャ可能回数</label><input id="aTickets" type="number" min="0" value="${state.tickets}">
    <label>今日の勉強時間（分）</label><input id="aToday" type="number" min="0" value="${state.todayStudy}">
    <label>累計勉強時間（分）</label><input id="aTotal" type="number" min="0" value="${state.totalStudy}">
    <label>試験日</label><input id="aExam" type="date" value="${state.examDate}">
    ${tableEditor("red","🔴 赤がちゃ 通常")}${tableEditor("blue","🔵 青がちゃ 通常")}
    ${tableEditor("redBonus","🔴 赤がちゃ 11回目")}${tableEditor("blueBonus","🔵 青がちゃ 11回目")}
    <div class="adminGrid"><button class="smallbtn" id="adminSave">修正を保存</button><button class="smallbtn" id="adminClose">閉じる</button></div>
    <hr><p style="font-size:12px;color:#777">※確率は管理画面でのみ変更できます。通常画面の詳細には通常1連の確率のみ表示します。</p>
    <button class="smallbtn danger" id="reset">全データ初期化</button>`;
  document.getElementById("adminSave").onclick=async()=>{
    const next=clone(state);
    next.tickets=Math.max(0,+document.getElementById("aTickets").value||0);
    next.todayStudy=Math.max(0,+document.getElementById("aToday").value||0);
    next.totalStudy=Math.max(0,+document.getElementById("aTotal").value||0);
    next.examDate=document.getElementById("aExam").value||"2026-10-18";
    const keys=["red","blue","redBonus","blueBonus"];
    for(const key of keys){
      let sum=0;
      for(let i=0;i<next.tables[key].length;i++){
        const amt=Math.max(0,+document.getElementById(`${key}_amt_${i}`).value||0);
        const p=Math.max(0,+document.getElementById(`${key}_p_${i}`).value||0);
        next.tables[key][i][1]=amt;next.tables[key][i][2]=p;sum+=p;
      }
      if(Math.abs(sum-100)>0.001){
        openModal(`<h2>確率を確認してください</h2><p>${key}の確率合計が <b>${sum}%</b> です。<br>100%になるよう修正してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
        return;
      }
    }
    try{
      await updateCloud(()=>next);
      showAdmin();
    }catch(err){
      console.error(err);
      openModal(`<h2>保存できませんでした</h2><p>Firebaseへの接続でエラーが発生しました。</p><p style="font-size:12px;text-align:left;word-break:break-word;background:#111;padding:10px;border-radius:8px;">${escapeHtml((err && (err.code || err.message)) ? ((err.code||"") + " " + (err.message||"")) : String(err))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }
  };
  document.getElementById("adminClose").onclick=()=>a.classList.remove("open");
  document.getElementById("reset").onclick=async()=>{
    if(confirm("全データを初期化します。よろしいですか？")){
      if(confirm("本当に削除しますか？")){
        try{
          await deleteDoc(STATE_REF);
          localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);
          state=clone(defaults);cloudReady=false;
          await ensureCloudState();
          render();showAdmin();
        }catch(err){
          console.error(err);
          openModal(`<h2>初期化できませんでした</h2><p>Firebaseへの接続を確認してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
        }
      }
    }
  };
}

(async function init(){
  render();
  try{
    await ensureCloudState();
  }catch(err){
    console.error(err);
    cloudReady=false;
    state=readLocalSeed();
    render();
    setCloudStatus("⚠️ Firebase接続エラー");
    openModal(`<h2>Firebaseに接続できません</h2><p>Firebaseから返されたエラーを確認してください。</p><p style="font-size:12px;text-align:left;word-break:break-word;background:#111;color:#fff;padding:10px;border-radius:8px;">${escapeHtml((err && (err.code || err.message)) ? ((err.code||"") + " " + (err.message||"")) : String(err))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
  }
})();
setInterval(()=>{if(cloudReady)refreshCloud().catch(console.error);},60000);
</script>
</body>
